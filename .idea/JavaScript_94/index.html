<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Зміна елементів через JavaScript</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
  />

  <style>
    .page-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 15px;
    }

    .custom-image {
      width: min(300px, 100%);
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      transition: all 0.3s ease;
    }

    .image-rounded {
      border-radius: 20px;
      border: 4px solid #0d6efd;
      box-shadow: 0 8px 20px rgba(13, 110, 253, 0.25);
    }

    .image-circle {
      border-radius: 50%;
      border: 4px solid #6c757d;
      box-shadow: 0 8px 20px rgba(108, 117, 125, 0.25);
      transform: scale(0.95);
    }

    @media (max-width: 576px) {
      #mainTitle {
        font-size: 2rem;
      }

      #descriptionText {
        font-size: 1.1rem !important;
      }

      .custom-image {
        width: min(220px, 100%);
      }
    }
  </style>
</head>
<body class="bg-light">
<div class="container page-container">
  <h1 id="mainTitle" class="mb-4">Практична робота з елементами сторінки</h1>

  <button id="changeTitleBtn" class="btn btn-primary mb-4">
    Оновити заголовок
  </button>

  <div class="mb-3">
    <img
            id="mainImage"
            class="custom-image image-rounded"
            src="dom-image.jpg"
            alt="Ілюстрація для прикладу роботи зі сторінкою"
    />
  </div>

  <button id="toggleImageStyleBtn" class="btn btn-secondary mb-4">
    Змінити вигляд зображення
  </button>

  <p id="descriptionText" class="fs-4 mb-4">
    За допомогою JavaScript можна змінювати вміст сторінки, її оформлення та робити інтерфейс більш динамічним.
  </p>

  <button id="updateDescriptionBtn" class="btn btn-success">
    Оновити текст
  </button>
</div>

<script>
  const mainTitle = document.getElementById("mainTitle");
  const changeTitleBtn = document.getElementById("changeTitleBtn");

  const mainImage = document.getElementById("mainImage");
  const toggleImageStyleBtn = document.getElementById("toggleImageStyleBtn");

  const descriptionText = document.getElementById("descriptionText");
  const updateDescriptionBtn = document.getElementById("updateDescriptionBtn");

  const originalTitle = "Практична робота з елементами сторінки";
  const newTitle = "DOM допомагає змінювати вебсторінку в реальному часі";

  const originalDescription =
          "За допомогою JavaScript можна змінювати вміст сторінки, її оформлення та робити інтерфейс більш динамічним.";

  const newDescription =
          "Робота з DOM дозволяє знаходити потрібні елементи, редагувати текст, змінювати стилі та реагувати на натискання кнопок.";

  let isRounded = true;

  changeTitleBtn.addEventListener("click", function () {
    if (mainTitle.textContent === originalTitle) {
      mainTitle.textContent = newTitle;
    } else {
      mainTitle.textContent = originalTitle;
    }
  });

  toggleImageStyleBtn.addEventListener("click", function () {
    if (isRounded) {
      mainImage.classList.remove("image-rounded");
      mainImage.classList.add("image-circle");
    } else {
      mainImage.classList.remove("image-circle");
      mainImage.classList.add("image-rounded");
    }

    isRounded = !isRounded;
  });

  updateDescriptionBtn.addEventListener("click", function () {
    if (descriptionText.textContent === originalDescription) {
      descriptionText.textContent = newDescription;
    } else {
      descriptionText.textContent = originalDescription;
    }
  });
</script>
</body>
</html>
